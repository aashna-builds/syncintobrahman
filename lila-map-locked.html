<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060912">
<meta name="robots" content="noindex,nofollow">
<title>Lila atlas</title>
<style>

:root{--bg:#faf8f4;--paper:#fff;--ink:#1c2430;--soft:#4a5565;--line:#d9d3c7;--accent:#1d4e89;
--echo:#1d5fa8;--deepen:#1f6b45;--tension:#a5480f;--contra:#8a1f3d;--warn:#8a1f1f;--warnbg:#fdecea;--infobg:#eef3fa;--chkbg:#f4f1ea;
--night:#060912;--star:#e8f0ff;--mist:#a9bbdb;--life:#ff9a3c}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--night);color:var(--star);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.banner{background:#2b2118;color:#fff;padding:10px 16px;font-size:16px}
.banner strong{letter-spacing:.04em}
.banner p{margin:2px 0 0;color:#f1e9dc}
header.top{padding:4px 16px 0;max-width:1800px;margin:0 auto}
h1{font-size:1.2rem;margin:0;font-weight:650;display:inline}
.sub{margin:2px 0 0;color:var(--mist);font-size:15px}
.wrap{max-width:1800px;margin:0 auto;padding:6px 16px 40px;display:grid;grid-template-columns:minmax(0,72fr) minmax(380px,28fr);gap:20px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.wrap>section,.wrap>aside{min-width:0}
.filters{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:8px 0;align-items:center;padding-bottom:6px}
.filters .chip{flex:none;white-space:nowrap}
.stage{position:relative;transform-origin:0 0;transition:transform .85s cubic-bezier(.25,.1,.2,1)}
.showc{font:inherit;font-size:15px;background:#0c1426;color:var(--star);border:1px solid #3d5683;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:44px;margin-top:6px}
.showc:hover{border-color:var(--life)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}
.filters .lbl{font-weight:600;margin-right:4px}
.chip{font:inherit;font-size:15px;border:1px solid #b9b2a4;background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#filters .chip,.calm{background:#0c1426;color:var(--star);border-color:#3d5683}
#filters .chip:hover,.calm:hover{border-color:var(--life)}
#filters .chip[aria-pressed="true"],.calm[aria-pressed="true"]{background:#2a4f8f;color:#fff;border-color:#8fb4ff}
.calm{position:absolute;top:10px;right:10px;z-index:3;font:inherit;font-size:15px;border:1px solid;border-radius:999px;padding:4px 14px;cursor:pointer}
:focus-visible{outline:3px solid #ffd24a;outline-offset:2px}
.mapbox{position:relative;border:1px solid #1f2d4a;border-radius:10px;overflow:hidden;
background:
 radial-gradient(ellipse 55% 45% at 22% 28%,rgba(50,90,170,.22),transparent 70%),
 radial-gradient(ellipse 60% 50% at 80% 72%,rgba(30,70,150,.20),transparent 70%),
 radial-gradient(ellipse 30% 22% at 52% 50%,rgba(190,110,50,.16),transparent 70%),
 linear-gradient(-30deg,transparent 28%,rgba(140,165,225,.10) 40%,rgba(185,205,245,.17) 50%,rgba(140,165,225,.10) 60%,transparent 72%),
 linear-gradient(180deg,#070b16,#050810);
box-shadow:inset 0 0 90px rgba(0,0,0,.6)}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
svg{display:block;width:100%;height:auto;position:relative}
.strip{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 4px;font-size:15px;color:var(--star);align-items:center}
.strip .sep{width:1px;height:18px;background:#2c4068}
.strip .it{display:flex;align-items:center;gap:8px}
.strip svg.ln{width:44px;height:14px;flex:none}
.legnote{margin:6px 2px;color:var(--mist);font-size:15px}
.node{cursor:pointer}
.node .rim{fill:url(#pl-rim);pointer-events:none}
.node.unp .body,.node.unp .rim{opacity:.55}
.node .upring{fill:none;stroke:#a8b6d0;stroke-dasharray:4 4;stroke-width:1.6;opacity:.9;pointer-events:none}
.node .fring{fill:none;stroke:transparent;stroke-width:3}
.node:hover .fring{stroke:#ffb36b;stroke-width:2}
.node.sel .fring{stroke:var(--life);stroke-width:2.6}
.node:focus-visible .fring{stroke:#ffd24a;stroke-width:4}
.node:focus{outline:none}
.node.sel .body{fill:url(#pl-warm)}
.node.hit .body{stroke:#ffb36b;stroke-width:3}
.node.dim{opacity:.3}
.node .lb{fill:#060912;fill-opacity:.8;stroke:#2c4068;stroke-width:1}
.node.unp .lb{stroke-dasharray:4 3}
.node text{fill:#eef4ff;font-size:14px;pointer-events:none}
.node.unp text{fill:#c9d3e8}
.node text.id{font-weight:700}
.node.sel .lb{stroke:var(--life)}
.moon{cursor:pointer}
.moon:hover .ms{stroke:#fff;stroke-width:2}
.capt{font-size:13px;fill:#8ea0c4;letter-spacing:.04em}
.lensicon{width:22px;height:22px;flex:none}
.sg{fill:url(#g-blue);pointer-events:none}
.sg.warm{fill:url(#g-warm)}
.gl .sg{display:none}
.edge{cursor:pointer}
.edge .vis{opacity:.4;transition:opacity .3s,stroke-width .2s}
.edge[data-type="deepens"] .vis{opacity:.28}
.edge text{opacity:0;transition:opacity .25s}
.edge.lit text,.edge.sel text,.edge:focus-visible text{opacity:1}
.edge.lit .vis,.edge.sel .vis{opacity:1}
.edge.faint .vis{opacity:.12}
.edge.dim .vis{opacity:.08}
.edge:focus{outline:none}
.edge:focus-visible .vis{stroke-width:5;opacity:1}
.edge text{font-size:13px;fill:#dbe6ff;paint-order:stroke;stroke:#060912;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.edge.sel .vis{stroke-width:5}
.zone{fill:rgba(10,16,32,.35);stroke:#6f7f9f;stroke-dasharray:6 5}
.zonelbl{font-size:14px;fill:#c3cfe6}
.hint{color:var(--mist);margin:6px 2px}
.conns{margin:14px 0 0;padding:0;list-style:none}
.conns li{margin:4px 0}
.conns button{font:inherit;font-size:15px;text-align:left;background:#0c1426;color:var(--star);border:1px solid #2c4068;border-radius:8px;padding:6px 10px;cursor:pointer;width:100%}
.conns button:hover{border-color:var(--life)}
.conns .ty{font-weight:700}
h2.sec{font-size:1.05rem;margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){.edge .vis{transition:none}}
/* panel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:16px;line-height:1.6}
@media (min-width:901px){.panel{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}}
.panel h2{font-size:1.35rem;margin:0 0 6px}
.panel h3{font-size:1.15rem;margin:22px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.panel h4{font-size:1.05rem;margin:16px 0 4px;color:var(--accent)}
.panel p{margin:6px 0}
.panel ul,.panel ol{margin:4px 0 6px;padding-left:22px}
.panel li{margin:6px 0}
.panel li.check{list-style:none;margin:6px 0 6px -6px;padding:6px 10px;background:var(--chkbg);border-left:4px solid #8c8470;border-radius:0 6px 6px 0;font-size:16px}
.panel ul ul{padding-left:14px}
.notetext{margin:6px 0 10px;padding:10px 14px;border-left:5px solid var(--accent);background:var(--infobg);font-size:1.1rem}
.notetext small{display:block;font-size:14px;color:var(--soft);margin-bottom:2px}
.alert{border:2px solid var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 14px;margin:12px 0}
.alert h3{border:0;margin:6px 0 4px;padding:0;color:var(--warn)}
.alert.info{border-color:var(--accent);background:var(--infobg)}
.alert.info h3{color:var(--accent)}
.flagchip{display:inline-block;background:var(--warn);color:#fff;font-weight:700;border-radius:6px;padding:3px 10px;margin:2px 0 6px}
.flagchip.info{background:var(--accent)}
.forhim{border:2px solid #b36b00;background:#fff6e0;border-radius:8px;padding:8px 14px;margin:12px 0}
.forhim h3{border:0;margin:6px 0 2px;padding:0;color:#7a4700}
.lbl-e,.lbl-t,.lbl-i{font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap}
.lbl-e{background:#dff1e6;color:#0f4a2a}
.lbl-t{background:#e6e0f5;color:#3b2a78}
.lbl-i{background:#fde9c8;color:#6b3d00}
.chk{background:#222;color:#fff;font-weight:700;border-radius:4px;padding:0 5px}
.dis{background:#fdd;color:#7a1111;font-weight:700;border-radius:4px;padding:0 4px}
.agr{background:#e3f2e8;color:#0f4a2a;font-weight:700;border-radius:4px;padding:0 4px}
.tcs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.close{font:inherit;float:right;border:1px solid #b9b2a4;background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
.jump{font-size:15px;color:var(--soft);margin:2px 0 8px}
.edgebox{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--chkbg);margin:10px 0}
.intro li{margin:6px 0}
.panel{color:var(--ink)}
.panel .flash{background:#fff3c4;box-shadow:-8px 0 0 #e0a100;border-radius:4px}
.panel .notetext{font-size:1.45rem;line-height:1.4}
.panel .notetext.long{font-size:1.15rem;line-height:1.5}
.panel details.sec{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff}
.panel details.sec>summary{cursor:pointer;font-weight:700;font-size:16px;padding:10px 12px;min-height:44px;display:list-item}
.panel details.sec>.in{padding:0 14px 10px}
.panel details.alert{border:2px solid var(--warn);background:var(--warnbg)}
.panel details.alert>summary{color:var(--warn)}
.panel details.alert.info{border-color:var(--accent);background:var(--infobg)}
.panel details.alert.info>summary{color:var(--accent)}
.panel details.unpl{border-color:#5b4a14;background:#faf3d9}
.panel details.unpl>summary{color:#5b4a14}
.panel .mchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.panel .mchip{font:inherit;font-size:16px;display:inline-flex;align-items:center;gap:6px;border:1px solid #b9b2a4;background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;min-height:44px;cursor:pointer}
.panel .mchip[disabled]{opacity:.65;cursor:default;border-style:dashed}
.panel .mchip:not([disabled]):hover{border-color:var(--accent)}
.panel .mchip svg{width:22px;height:22px;flex:none;background:#0b1226;border-radius:50%}
.panel .mchip .st{color:var(--soft)}
.panel .notetext small,.panel .jump,.panel .chip,.panel .close{font-size:16px}

</style>
<style>
/* gate (login) styles, generic UI only */
#gate{position:fixed;inset:0;z-index:200;overflow:hidden;color:#e8f0ff;
 font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:
  radial-gradient(ellipse 55% 45% at 20% 28%,rgba(50,90,170,.22),transparent 70%),
  radial-gradient(ellipse 60% 50% at 82% 74%,rgba(30,70,150,.18),transparent 70%),
  linear-gradient(-30deg,transparent 26%,rgba(140,165,225,.07) 40%,rgba(185,205,245,.13) 50%,rgba(140,165,225,.07) 60%,transparent 74%),
  linear-gradient(180deg,#070b16,#04060d);
 display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .45s ease}
#gate.out{opacity:0;pointer-events:none}
#gs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gate .col{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(100%,380px)}
#gate .planet{position:relative;width:104px;height:104px;margin-bottom:26px}
#gate .planet::before{content:"";position:absolute;inset:-46px;border-radius:50%;
 background:radial-gradient(circle,rgba(95,147,255,.30),rgba(95,147,255,0) 68%);animation:gbreath 7s ease-in-out infinite}
#gate .planet i{position:absolute;inset:0;border-radius:50%;
 background:radial-gradient(circle at 34% 30%,#f0f8ff 0,#8bc4ff 34%,#2a5a96 78%,#102440 100%);
 box-shadow:inset -10px -8px 22px rgba(4,8,20,.65),0 0 34px rgba(120,170,255,.25);animation:gbreath2 7s ease-in-out infinite}
#gate .planet::after{content:"";position:absolute;left:30%;top:34%;width:40%;height:40%;border-radius:50%;
 background:radial-gradient(circle,rgba(255,154,60,.28),rgba(255,154,60,0) 70%);animation:gbreath 7s ease-in-out infinite;pointer-events:none}
@keyframes gbreath{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
@keyframes gbreath2{0%,100%{transform:scale(.985)}50%{transform:scale(1.025)}}
#gate .gt{margin:0;font-size:2rem;line-height:1.2;font-weight:600;letter-spacing:.02em;display:block}
#gate .lead{margin:6px 0 22px;color:#a9bbdb;font-size:1.05rem}
#gate .row{display:flex;flex-direction:column;gap:12px;width:100%}
#gate .field{position:relative;display:flex}
#gate input{flex:1;min-width:0;font:inherit;font-size:18px;color:#eef4ff;background:rgba(10,18,36,.82);border:1px solid #3d5683;border-radius:10px;
 padding:0 76px 0 14px;min-height:52px;letter-spacing:.06em}
#gate input:focus{outline:none;border-color:#ff9a3c;box-shadow:0 0 0 3px rgba(255,154,60,.25)}
#gate #tg{position:absolute;right:4px;top:4px;bottom:4px;min-width:64px;min-height:44px;font:inherit;font-size:16px;color:#c9d6f2;background:transparent;border:0;border-radius:8px;cursor:pointer}
#gate #tg:hover{color:#fff}
#gate #go{font:inherit;font-size:18px;font-weight:600;min-height:52px;color:#fff;background:#2a4f8f;border:1px solid #8fb4ff;border-radius:10px;cursor:pointer}
#gate #go:hover{border-color:#ff9a3c}
#gate #go:disabled{opacity:.6;cursor:default}
#gate .msg{min-height:1.6em;margin:14px 0 0;color:#ffd9b0;font-size:16px}
#gate .note{color:#e8f0ff}
#warp{position:fixed;inset:0;width:100%;height:100%;z-index:300;display:block;touch-action:manipulation}
.snd{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:0 14px;margin-left:auto;flex:none;background:#0c1426;color:#e8f0ff;border:1px solid #3d5683;border-radius:999px;cursor:pointer;white-space:nowrap}
.snd:hover{border-color:#ff9a3c}
.snd[aria-pressed="true"]{background:#2a4f8f;border-color:#8fb4ff;color:#fff}
.banner.flexb{display:flex;align-items:center;gap:10px}
.banner.flexb .bt{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){
 #gate .planet::before,#gate .planet::after,#gate .planet i{animation:none}
 #gate{transition:none}
}

</style>
</head>
<body>
<main id="gate">
<canvas id="gs" aria-hidden="true"></canvas>
<div class="col">
<div class="planet" aria-hidden="true"><i></i></div>
<h1 class="gt">Lila atlas</h1>
<p class="lead">Enter the passcode.</p>
<div id="form" class="row">
<div class="field"><input id="pc" type="password" aria-label="Passcode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" enterkeyhint="go"><button id="tg" type="button" aria-label="Show passcode" aria-pressed="false">Show</button></div>
<button id="go" type="button">Enter</button>
</div>
<p id="msg" class="msg" role="status" aria-live="polite"></p>
</div>
</main>

function bell(){

    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2*p[1],t+0.015); g.gain.setTargetAtTime(0,t+0.015,p[2]);

function schedule(first){

  driftT=setTimeout(function(){ glide(); }, rnd(25000,45000));
}
function glide(){
  if(!on||!ctx||ctx.state!=="running") return;
  var v=voices[1+Math.floor(Math.random()*(voices.length-1))], f=v.p.pool[Math.floor(Math.random()*v.p.pool.length)], t=ctx.currentTime;

function start(){
  if(!prepare()) return; build(); on=true;

}

  var t=ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(0,t+0.4);
  setTimeout(function(){ if(!on){ try{ ctx.suspend(); }catch(e){} } },500);
}
function saved(){ try{ var v=localStorage.getItem(KEY); return v==="on"?true:(v==="off"?false:null); }catch(e){ return null; } }
function save(v){ try{ localStorage.setItem(KEY,v?"on":"off"); }catch(e){} }
function attach(btn,calmDefault){
  if(!AC){ btn.hidden=true; return; }
  var s=saved(), want=(s===null)?!calmDefault:s;
  function paint(){ btn.setAttribute("aria-pressed",String(on)); btn.textContent=on?"Sound: on":"Sound: off"; btn.setAttribute("aria-label",on?"Sound is on. Press to mute.":"Sound is off. Press to turn on."); }
  btn.addEventListener("click",function(){ if(on) stop(); else start(); save(on); paint(); });

  paint();
  document.addEventListener("visibilitychange",function(){

    if(document.hidden){ clearTimeout(bellT); clearTimeout(driftT); try{ ctx.suspend(); }catch(e){} }
    else if(on){ try{ ctx.resume(); }catch(e){} schedule(false); }
  });
}
window.Music={prepare:prepare,attach:attach,
  state:function(){ return {has:!!ctx,ctx:ctx?ctx.state:"none",gain:master?master.gain.value:null,on:on,voices:voices.length}; }};
})();

</script>
<script>
/* Warp-in: stars stream out from the centre, ease to a stop, and the map is revealed. About 2 s. Tap or any key skips.
   Budget: 180 streaks (90 on phones), one canvas, two stroke batches per frame, removed when done. */
(function(){
"use strict";
function play(done){
  var rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(rm){ done(); return {skipped:true,calm:true}; }
  var phone=Math.min(window.innerWidth,window.innerHeight)<600, N=phone?90:180;
  var cv=document.createElement("canvas"); cv.id="warp"; cv.setAttribute("aria-hidden","true");
  var dpr=Math.min(window.devicePixelRatio||1,phone?2:2), W=window.innerWidth, H=window.innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); document.body.appendChild(cv);
  var x=cv.getContext("2d"); if(!x){ cv.remove(); done(); return; }
  var S=[], i, maxR=Math.hypot(W,H)/2+20;
  for(i=0;i<N;i++){ S.push({a:Math.random()*6.2832,r:Math.random()*maxR*.9,k:.5+Math.random()*1.1,w:Math.random()<.08}); }
  var D=2000, t0=0, skipAt=0, finished=false, last=0, api={frames:0,skipped:false};
  function ease(u){ var v=1-u; return v*v*v; }
  function end(){ if(finished) return; finished=true; cv.remove(); document.removeEventListener("keydown",onKey); done(); }
  function skip(){ if(skipAt||finished) return; skipAt=performance.now(); api.skipped=true; }
  function onKey(){ skip(); }
  cv.addEventListener("pointerdown",skip); document.addEventListener("keydown",onKey);
  function frame(now){
    if(finished) return;
    if(!t0){ t0=now; last=now; }
    var u=Math.min(1,(now-t0)/D), dt=Math.min(.05,(now-last)/1000); last=now; api.frames++;
    var sk=skipAt?Math.min(1,(now-skipAt)/350):0;
    var v=ease(u)*2600+30, bgA=u<.45?1:Math.max(0,1-(u-.45)/.55), fade=1-u*.25;
    if(skipAt){ bgA=Math.min(bgA,1-sk); fade*=1-sk; }
    x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
    x.fillStyle="rgba(6,9,18,"+bgA.toFixed(3)+")"; x.fillRect(0,0,W,H);
    x.globalCompositeOperation="lighter"; x.lineCap="round";
    var cx=W/2, cy=H/2, cool=new Path2D(), warm=new Path2D();
    for(i=0;i<N;i++){
      var s=S[i], sp=v*s.k*(.25+s.r/maxR); s.r+=sp*dt;
      if(s.r>maxR){ s.r=Math.random()*maxR*.08; s.a=Math.random()*6.2832; }
      var tail=Math.min(s.r, sp*.035+1.5), ca=Math.cos(s.a), sa=Math.sin(s.a), p=s.w?warm:cool;
      p.moveTo(cx+ca*(s.r-tail),cy+sa*(s.r-tail)); p.lineTo(cx+ca*s.r,cy+sa*s.r);
    }
    x.lineWidth=1.4; x.globalAlpha=.9*fade; x.strokeStyle="#cfe0ff"; x.stroke(cool);
    x.globalAlpha=.9*fade; x.strokeStyle="#ffb36b"; x.stroke(warm);
    if(u>=1||sk>=1) return end();
    requestAnimationFrame(frame);
  }
  x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle="rgb(6,9,18)"; x.fillRect(0,0,W,H);   /* opaque at once, no flash of the map */
  requestAnimationFrame(frame);
  return api;
}
window.Warp={play:play};
})();

</script>
<script>
/* Gate: one passcode, WebCrypto decrypt (PBKDF2-SHA256 -> AES-256-GCM), then boot the map from the decrypted payload. */
(function(){
"use strict";
var L=window.__LOCK, $=function(i){return document.getElementById(i);};
var gate=$("gate"), input=$("pc"), btn=$("go"), tog=$("tg"), msg=$("msg"), busy=false;
var NOSUB="This browser can't unlock files opened this way. Open it in Safari or Chrome from a web address.";

/* static faint Milky Way star band behind the gate, drawn once */
(function(){
  var cv=$("gs"), x=cv.getContext&&cv.getContext("2d"); if(!x) return;
  var W=window.innerWidth,H=window.innerHeight,d=Math.min(window.devicePixelRatio||1,2); cv.width=W*d; cv.height=H*d; x.scale(d,d);
  var s=7; function r(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }
  var th=-.5, dx=Math.cos(th), dy=Math.sin(th), nx=-dy, ny=dx, hy=Math.hypot(W,H), sg=Math.min(W,H)*.13, n=Math.min(520,Math.round(W*H/2600));
  for(var i=0;i<n;i++){
    var inBand=i<n*.8, px,py,a;
    if(inBand){ var u=(r()-.5)*hy*1.1, v=(r()+r()+r()-1.5)*2*sg; px=W/2+dx*u+nx*v; py=H/2+dy*u+ny*v; a=.1+r()*.35*Math.exp(-Math.abs(v)/(sg*1.3)); }
    else { px=r()*W; py=r()*H; a=.08+r()*.22; }
    x.globalAlpha=Math.min(a,.5); x.fillStyle=r()<.07?"#ffb36b":"#cfe0ff"; var z=.5+r()*r()*1.6; x.fillRect(px,py,z,z);
  }
})();

if(!(window.crypto&&window.crypto.subtle)){
  $("form").hidden=true; msg.className="msg note"; msg.textContent=NOSUB; return;
}
function b64(s){ var b=atob(s),u=new Uint8Array(b.length),i; for(i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(L.s),iterations:L.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

  input.value="";
  try{ boot(data); }catch(e){ console.error(e); msg.textContent="Something went wrong opening this."; btn.disabled=false; busy=false; }
}
function run(code){ var s=document.createElement("script"); s.text=code; document.body.appendChild(s); document.body.removeChild(s); }
function boot(d){

  d.scripts.forEach(run);
  var ban=document.querySelector(".banner");
  var b=document.createElement("button"); b.type="button"; b.className="snd"; b.id="snd";
  if(ban){
    var span=document.createElement("span"); span.className="bt";
    while(ban.firstChild) span.appendChild(ban.firstChild);
    ban.appendChild(span); ban.appendChild(b); ban.classList.add("flexb");

  if(window.Music) Music.attach(b,rm||!!(window.__atlas&&window.__atlas.fx&&window.__atlas.fx.calm));

  if(rm){ gate.classList.add("out"); setTimeout(function(){ if(gate.parentNode) gate.parentNode.removeChild(gate); },60); }
  else if(gate.parentNode) gate.parentNode.removeChild(gate);
}
btn.addEventListener("click",submit);
input.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
tog.addEventListener("click",function(){
  var show=input.type==="password"; input.type=show?"text":"password"; tog.textContent=show?"Hide":"Show";
  tog.setAttribute("aria-label",show?"Hide passcode":"Show passcode"); tog.setAttribute("aria-pressed",String(show)); input.focus();
});
setTimeout(function(){ try{ input.focus({preventScroll:true}); }catch(e){} },50);
})();

</script>
